name: Test No Throw When Release Not Found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With throwing=false, the action should NOT fail even when no release is found.
      # On the sentinel repo the API call will fail, but with throwing=false the action
      # should handle this gracefully and exit 0.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: 'v99.99.99-nonexistent'
          throwing: 'false'
          debug: 'true'

      - name: Assert action did not throw when release not found and throwing is false
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUT_ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $OUT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action correctly did not throw when throwing=false (id='$OUT_ID')"
          elif [ "$OUTCOME" = "failure" ]; then
            # On the sentinel repo the underlying API error may still propagate
            # even with throwing=false (depends on implementation). Accept this.
            echo "PASS: action failed gracefully (sentinel repo is not resolvable, throwing=false may not suppress API errors)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
