name: Test Get Latest Release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          latest: 'true'
          debug: 'true'
          throwing: 'false'

      - name: Assert action ran and either returned a release or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUT_ID: ${{ steps.action.outputs.id }}
          OUT_TAG: ${{ steps.action.outputs.tag_name }}
          OUT_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $OUT_ID"
          echo "tag_name: $OUT_TAG"
          echo "html_url: $OUT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUT_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            if [ -z "$OUT_TAG" ]; then
              echo "FAIL: action succeeded but tag_name output is empty"
              exit 1
            fi
            echo "PASS: got release id='$OUT_ID' tag='$OUT_TAG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
