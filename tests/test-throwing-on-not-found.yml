name: Test Throwing When Release Not Found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With throwing=true, the action should fail when no release is found
      # (which is guaranteed on the sentinel repo). We expect failure here.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: 'v99.99.99-nonexistent'
          throwing: 'true'
          debug: 'true'

      - name: Assert action failed when release not found and throwing is true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when release not found with throwing=true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when release not found with throwing=true"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
