name: Test no release found with throwing false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: actions
          repo: checkout
          tag_name: 'v99.99.99-nonexistent-tag'
          debug: 'true'
          throwing: 'false'
        continue-on-error: true
      - name: Assert action does not throw when release not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          # With throwing=false, the action should either succeed with empty outputs
          # or fail gracefully (e.g. API rate limit). It must NOT hard-crash.
          if [ "$OUTCOME" = "success" ]; then
            # Release not found, outputs should be empty
            if [ -n "$RELEASE_ID" ]; then
              echo "FAIL: expected empty id for non-existent tag but got '$RELEASE_ID'"
              exit 1
            fi
            echo "PASS: action succeeded with no release found (throwing=false)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
