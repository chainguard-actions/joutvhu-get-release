name: Test get latest release with pattern filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          owner: actions
          repo: checkout
          latest: 'true'
          pattern: 'v4\.'
          debug: 'true'
          throwing: 'true'

      - name: Assert id is set
        env:
          ACTUAL: ${{ steps.action.outputs.id }}
        run: |
          echo "id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected id to be non-empty"
            exit 1
          fi
          echo "PASS: id=$ACTUAL"

      - name: Assert tag_name matches pattern v4.*
        env:
          ACTUAL: ${{ steps.action.outputs.tag_name }}
        run: |
          echo "tag_name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected tag_name to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^v4\.'; then
            echo "FAIL: expected tag_name to match v4.* pattern, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: tag_name=$ACTUAL matches v4.* pattern"

      - name: Assert assets_url is set
        env:
          ACTUAL: ${{ steps.action.outputs.assets_url }}
        run: |
          echo "assets_url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected assets_url to be non-empty"
            exit 1
          fi
          echo "PASS: assets_url=$ACTUAL"
