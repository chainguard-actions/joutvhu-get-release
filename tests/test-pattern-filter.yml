name: Test pattern filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: actions
          repo: checkout
          latest: 'true'
          pattern: 'v*'
          throwing: 'false'

      - name: Assert action ran with pattern input (outputs set, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: action succeeded but tag_name output is empty"
              exit 1
            fi
            echo "PASS: got tag_name='$TAG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API call failed under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
