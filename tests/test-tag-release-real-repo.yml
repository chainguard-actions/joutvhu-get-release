name: Test get release by tag from real repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: actions
          repo: checkout
          tag_name: 'v4.2.2'
          debug: 'true'
          throwing: 'false'
        continue-on-error: true
      - name: Assert release outputs for specific tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
          DRAFT: ${{ steps.action.outputs.draft }}
          PRERELEASE: ${{ steps.action.outputs.prerelease }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "tag_name: $TAG_NAME"
          echo "html_url: $HTML_URL"
          echo "draft: $DRAFT"
          echo "prerelease: $PRERELEASE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            if [ "$TAG_NAME" != "v4.2.2" ]; then
              echo "FAIL: expected tag_name 'v4.2.2' but got '$TAG_NAME'"
              exit 1
            fi
            echo "PASS: got release id=$RELEASE_ID tag=$TAG_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
