name: Test get latest release with pattern filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: actions
          repo: checkout
          latest: 'true'
          pattern: 'v4.*'
          debug: 'true'
          throwing: 'false'
        continue-on-error: true
      - name: Assert release matches pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          PUBLISHED_AT: ${{ steps.action.outputs.published_at }}
          CREATED_AT: ${{ steps.action.outputs.created_at }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "tag_name: $TAG_NAME"
          echo "published_at: $PUBLISHED_AT"
          echo "created_at: $CREATED_AT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            # Verify the tag matches the pattern v4.*
            case "$TAG_NAME" in
              v4.*)
                echo "PASS: tag '$TAG_NAME' matches pattern 'v4.*'"
                ;;
              *)
                echo "FAIL: tag '$TAG_NAME' does not match pattern 'v4.*'"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
