name: Test no-throw on missing release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          owner: actions
          repo: checkout
          tag_name: v0.0.0-nonexistent-tag-for-testing
          debug: 'true'
          throwing: 'false'
        continue-on-error: true

      - name: Assert action did not fail hard (throwing=false should not exit 1)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed even with throwing=false — expected graceful handling"
            exit 1
          fi
          echo "PASS: action completed without hard failure (outcome=$OUTCOME)"
