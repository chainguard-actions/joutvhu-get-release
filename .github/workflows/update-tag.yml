name: Update Major Version Tag

on:
  release:
    types: [released]

jobs:
  tagging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current release
        id: current_release
        uses: joutvhu/get-release@8c3531bba0d249f5e7c3d7e1954d34db9edf2a90 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get major version from release
        id: major_version
        env:
          TAG_NAME: ${{ steps.current_release.outputs.tag_name }}
        run: |
          echo "::set-output name=version::$(echo "$TAG_NAME" | cut -f 1 -d .)"

      - name: Create or update major version
        uses: joutvhu/create-tag@e5e6b59bb6ad5604c09de0409f1798edea88ae22 # v1
        with:
          tag_name: ${{ steps.major_version.outputs.version }}
          message: ${{ steps.current_release.outputs.name }}
          on_tag_exists: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
